version: '3.8'

services:
  esp32-obd2-backend:
    build: .
    container_name: esp32-obd2-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - WEBAPP_URL=${WEBAPP_URL}
    volumes:
      - obd_data:/usr/src/app/data

  ngrok:
    image: ngrok/ngrok:latest
    container_name: esp32-obd-ngrok
    restart: unless-stopped
    depends_on:
      - esp32-obd2-backend
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: "http --url=${NGROK_DOMAIN} esp32-obd2-backend:3000"

volumes:
  obd_data:
