[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200

build_flags =
    -DCONFIG_MBEDTLS_DYNAMIC_BUFFER=1
    -DCONFIG_MBEDTLS_DYNAMIC_FREE_PEER_CERT=1
    -DCONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=1
    -DCONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=4
    -DCONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=8
    -DCONFIG_ESP32_WIFI_STATIC_TX_BUFFER_NUM=4
    -DCONFIG_ESP32_WIFI_CACHE_TX_BUFFER_NUM=8

lib_deps =
    powerbroker2/ELMduino @ ^3.2.5
    bblanchon/ArduinoJson @ ^7.0.4
